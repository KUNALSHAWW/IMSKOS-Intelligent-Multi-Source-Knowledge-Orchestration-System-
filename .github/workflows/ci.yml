name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Backend Tests
  # ===========================================================================
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true
      
      - name: Check formatting with black
        run: |
          pip install black
          black --check --diff app
        continue-on-error: true
      
      - name: Run tests
        run: |
          pytest -v --tb=short
        env:
          ENVIRONMENT: test

  # ===========================================================================
  # Frontend Tests
  # ===========================================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Lint
        run: npm run lint
        continue-on-error: true
      
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Run tests
        run: npm run test:run

  # ===========================================================================
  # Docker Build & Integration Tests
  # ===========================================================================
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -t imskos-backend ./backend
      
      - name: Build frontend image
        run: docker build -t imskos-frontend ./frontend
        continue-on-error: true  # Frontend may not exist yet
      
      - name: Test docker-compose config
        run: |
          docker-compose -f docker-compose.dev.yml config

  # ===========================================================================
  # Indexing Smoke Test (Critical for preventing UI crashes)
  # ===========================================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: [backend]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest requests
      
      - name: Start backend server
        run: |
          cd backend
          uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 &
          sleep 10  # Wait for server to start
        env:
          ENVIRONMENT: test
          REDIS_URL: redis://localhost:6379/0
          MOCK_MODE: "true"
      
      - name: Verify backend health
        run: |
          curl -f http://localhost:8000/health || exit 1
          echo "✅ Backend is healthy"
      
      - name: Test indexing endpoint returns immediately
        run: |
          # Start timing
          START=$(date +%s.%N)
          
          # Call indexing endpoint
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8000/api/v1/index \
            -H "Content-Type: application/json" \
            -d '{"document_ids": ["smoke-test-doc-1", "smoke-test-doc-2"]}')
          
          # End timing
          END=$(date +%s.%N)
          ELAPSED=$(echo "$END - $START" | bc)
          
          # Extract status code (last line) and body
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response: $BODY"
          echo "Status: $HTTP_CODE"
          echo "Elapsed: ${ELAPSED}s"
          
          # Verify response
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Indexing endpoint failed with status $HTTP_CODE"
            exit 1
          fi
          
          # Verify it returned quickly (under 5 seconds)
          if (( $(echo "$ELAPSED > 5.0" | bc -l) )); then
            echo "❌ Indexing blocked for ${ELAPSED}s - should return immediately!"
            exit 1
          fi
          
          # Verify task_id is in response
          if ! echo "$BODY" | grep -q "task_id"; then
            echo "❌ Response missing task_id"
            exit 1
          fi
          
          echo "✅ Indexing smoke test passed - returned in ${ELAPSED}s"
      
      - name: Test backend remains responsive after indexing
        run: |
          # Trigger indexing and verify it succeeds
          HTTP_STATUS=$(curl -s -o /tmp/index_response.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/v1/index \
            -H "Content-Type: application/json" \
            -d '{"document_ids": ["responsive-test"]}')
          
          # Check if indexing request returned 2xx
          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "❌ Indexing request failed with status $HTTP_STATUS"
            cat /tmp/index_response.json
            exit 1
          fi
          
          echo "✅ Indexing request returned status $HTTP_STATUS"
          
          # Verify backend is still responsive after successful indexing
          for i in {1..5}; do
            if ! curl -f -s http://localhost:8000/health > /dev/null; then
              echo "❌ Backend became unresponsive after indexing!"
              exit 1
            fi
            echo "Health check $i: OK"
            sleep 1
          done
          
          echo "✅ Backend remained responsive after indexing"
      
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/test_index.py -v --tb=short
        env:
          ENVIRONMENT: test
          MOCK_MODE: "true"


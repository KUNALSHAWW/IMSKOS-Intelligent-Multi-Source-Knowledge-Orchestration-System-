name: Sync to Hugging Face Space

# GitHub is the source of truth. The Space gets a copy of main with Space metadata added to the README
# and without binary screenshots (Spaces reject non-LFS binaries). It is force-pushed, so there is
# never a rebase against the Space's own history.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the Space copy
        run: |
          printf '%s\n' '---' 'title: IMSKOS' 'emoji: 🧭' 'colorFrom: indigo' 'colorTo: blue' \
            'sdk: streamlit' 'sdk_version: 1.53.1' 'app_file: app.py' 'pinned: false' 'license: mit' '---' '' > /tmp/front.md
          cat /tmp/front.md README.md > /tmp/README.md
          mv /tmp/README.md README.md
          git rm -r -q --cached docs/screenshots
          git -c user.name="KUNAL SHAW" -c user.email="kunalshawkol16@gmail.com" \
            commit -q -am "Deploy to Hugging Face Space"

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force "https://KunalShaw:${HF_TOKEN}@huggingface.co/spaces/KunalShaw/IMSKOS" HEAD:main

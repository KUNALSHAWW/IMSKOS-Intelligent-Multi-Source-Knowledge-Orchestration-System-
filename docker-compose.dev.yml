# IMSKOS Development Docker Compose
# Run: docker-compose -f docker-compose.dev.yml up --build
#
# HOTFIX NOTES:
# - Added MOCK_MODE support for running without external services
# - Added memory limits to prevent OOM crashes
# - Recommended local machine: 8GB+ RAM (16GB for full functionality)
# - For low-resource machines: set MOCK_MODE=true in .env

services:
  # ==========================================================================
  # Backend API (FastAPI)
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imskos-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # HOTFIX: Mock mode for testing without external services
      - MOCK_MODE=${MOCK_MODE:-false}
      # Supabase (optional - mock mode if missing)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # Astra DB (optional - mock mode if missing)
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN:-}
      - ASTRA_DB_ID=${ASTRA_DB_ID:-}
      - ASTRA_DB_REGION=${ASTRA_DB_REGION:-}
      # LLM Providers (optional - mock mode if missing)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Redis (use local redis container)
      - REDIS_URL=redis://redis:6379/0
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-redis://redis:6379}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      # Security (REQUIRED - generate with: openssl rand -hex 32)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - ./backend:/app
      - backend-storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - imskos-network
    restart: unless-stopped
    # HOTFIX: Memory limit to prevent OOM crashes
    mem_limit: 4g
    memswap_limit: 4g

  # ==========================================================================
  # Worker (Celery for Background Tasks)
  # ==========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imskos-worker
    command: ["python", "-m", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # HOTFIX: Mock mode for testing without external services
      - MOCK_MODE=${MOCK_MODE:-false}
      - REDIS_URL=redis://redis:6379/0
      # Astra DB (optional - mock mode if missing)
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN:-}
      - ASTRA_DB_ID=${ASTRA_DB_ID:-}
      - ASTRA_DB_REGION=${ASTRA_DB_REGION:-}
      # LLM Providers (optional - mock mode if missing)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend-storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.from_url('redis://redis:6379/0'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - imskos-network
    restart: on-failure:3
    # HOTFIX: Memory limit for worker (higher due to embedding models)
    mem_limit: 6g
    memswap_limit: 6g

  # ==========================================================================
  # Frontend (Next.js)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imskos-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - imskos-network
    restart: unless-stopped
    # HOTFIX: Memory limit
    mem_limit: 1g

  # ==========================================================================
  # Streamlit Frontend (Alternative UI)
  # ==========================================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imskos-streamlit
    ports:
      - "8501:8501"
    environment:
      # HOTFIX: Use service hostname for backend (not localhost!)
      - BACKEND_URL=http://backend:8000
      # HOTFIX: Mock mode and safety toggles
      - MOCK_MODE=${MOCK_MODE:-false}
      - ENABLE_INDEX_BACKGROUND=${ENABLE_INDEX_BACKGROUND:-true}
      - INDEXING_DISABLED=${INDEXING_DISABLED:-false}
      - ASTRA_CONNECT_TIMEOUT=${ASTRA_CONNECT_TIMEOUT:-30}
      - INDEX_UI_TIMEOUT_SECONDS=${INDEX_UI_TIMEOUT_SECONDS:-600}
      - MAX_LOCAL_INDEX_MB=${MAX_LOCAL_INDEX_MB:-2}
      # External services (optional in mock mode)
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN:-}
      - ASTRA_DB_ID=${ASTRA_DB_ID:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./app.py:/app/app.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - imskos-network
    restart: unless-stopped
    # HOTFIX: Memory limit to prevent OOM crashes
    mem_limit: 2g
    memswap_limit: 2g

  # ==========================================================================
  # Redis (Job Queue)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: imskos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imskos-network
    restart: unless-stopped

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  backend-storage:
    driver: local
  redis-data:
    driver: local

# ==========================================================================
# Networks
# ==========================================================================
networks:
  imskos-network:
    driver: bridge

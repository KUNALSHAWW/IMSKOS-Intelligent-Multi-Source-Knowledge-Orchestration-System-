[theme]
base = "dark"
primaryColor = "#7C83FF"
backgroundColor = "#08090A"
secondaryBackgroundColor = "#0D0E10"
textColor = "#EDEEF0"
font = "sans serif"

[server]
headless = true
port = 8501
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[runner]
magicEnabled = true

[client]
showErrorDetails = true
toolbarMode = "auto"
